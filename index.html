<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fulkoli Shop Corner</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --daraz-orange: #f57224;
      --daraz-dark-orange: #d05307;
      --bg-color: #f4f4f6;
      --card-bg: #ffffff;
      --text-main: #212121;
      --text-muted: #757575;
      --glow-color: rgba(245, 114, 36, 0.4);
      --border-color: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Poppins', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }

    /* Daraz-Style Header */
    header {
      background: linear-gradient(135deg, #f57224 0%, #ff4747 100%);
      padding: 15px 20px; position: sticky; top: 0; z-index: 90;
      box-shadow: 0 4px 15px rgba(245, 114, 36, 0.3);
    }
    .brand-title { 
      font-size: 24px; font-weight: 700; color: #ffffff; text-align: center; 
      letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
    .brand-title span { color: #ffe600; }

    .search-container { max-width: 600px; margin: 12px auto 0 auto; position: relative; }
    .search-container input {
      width: 100%; padding: 12px 45px 12px 20px; border-radius: 25px; border: none;
      background: #ffffff; color: #1f2937; font-size: 14px; outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .search-container i {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      color: var(--daraz-orange); font-size: 16px;
    }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 12px; }

    /* Category Filter Section */
    .category-scroll {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #fff; border: 1.5px solid var(--border-color); color: var(--text-main);
      padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--daraz-orange); color: #fff; border-color: var(--daraz-orange);
      box-shadow: 0 4px 10px rgba(245, 114, 36, 0.25);
    }

    /* Grid & Glowing Product Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; } }

    .product-card {
      background: var(--card-bg); border-radius: 14px; padding: 12px;
      border: 1.5px solid rgba(245, 114, 36, 0.2);
      box-shadow: 0 0 10px rgba(245, 114, 36, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    
    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--daraz-orange);
      box-shadow: 0 0 18px var(--glow-color), 0 8px 25px rgba(0,0,0,0.08);
    }

    .img-box { 
      width: 100%; height: 150px; border-radius: 10px; overflow: hidden; 
      background: #f9fafb; margin-bottom: 10px; position: relative;
    }
    @media (min-width: 640px) { .img-box { height: 180px; } }
    .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .product-card:hover img { transform: scale(1.04); }
    
    .title { 
      font-size: 13.5px; font-weight: 600; color: #212121; margin-bottom: 6px; 
      height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
      line-height: 1.3;
    }
    
    .price { font-size: 17px; font-weight: 700; color: var(--daraz-orange); margin-bottom: 10px; }

    .card-actions { display: flex; gap: 6px; }
    .btn-cart-icon {
      background: #fff5f0; color: var(--daraz-orange); border: 1px solid var(--daraz-orange);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .btn-cart-icon:hover { background: var(--daraz-orange); color: #fff; }
    .btn-view { 
      flex: 1; background: var(--daraz-orange); color: #fff; 
      border: none; padding: 8px 0; border-radius: 8px; 
      font-weight: 600; font-size: 13px; text-align: center;
    }

    /* Floating Cart Button */
    .floating-cart {
      position: fixed; bottom: 20px; right: 20px;
      background: linear-gradient(135deg, #f57224 0%, #ff4747 100%);
      color: #fff; padding: 12px 20px; border-radius: 30px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 114, 36, 0.4); z-index: 99;
    }
    .cart-count { background: #fff; color: var(--daraz-orange); border-radius: 50%; padding: 2px 7px; font-size: 12px; font-weight: 700; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: 0.25s ease; padding: 15px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .detail-window { 
      background: #fff; width: 100%; max-width: 720px; max-height: 90vh; 
      border-radius: 18px; overflow-y: auto; position: relative; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    @media (min-width: 640px) { .detail-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 22px; } }

    .close-btn { 
      position: absolute; top: 12px; right: 15px; color: #4b5563; font-size: 22px; 
      cursor: pointer; border: none; background: #f3f4f6; width: 34px; height: 34px; 
      border-radius: 50%; z-index: 10;
    }
    
    .gallery-container { padding: 15px; }
    .main-preview { width: 100%; height: 220px; border-radius: 12px; object-fit: cover; background: #f3f4f6; margin-bottom: 10px; }
    .thumb-list { display: flex; gap: 8px; overflow-x: auto; }
    .thumb-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
    .thumb-img.active { border-color: var(--daraz-orange); }
    
    .info-container { padding: 15px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #111827; }
    .modal-price { font-size: 22px; font-weight: 700; color: var(--daraz-orange); margin-bottom: 8px; }
    .modal-desc { font-size: 13px; color: #6b7280; margin-bottom: 15px; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { 
      width: 100%; padding: 9px 12px; background: #f9fafb; border: 1px solid var(--border-color); 
      border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--daraz-orange); background: #fff;
    }
    
    .btn-submit-order { 
      width: 100%; background: linear-gradient(135deg, #f57224 0%, #ff4747 100%); 
      color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 15px; 
      font-weight: 700; cursor: pointer; margin-top: 12px; box-shadow: 0 4px 12px rgba(245, 114, 36, 0.3);
    }
    .btn-add-cart-modal {
      width: 100%; background: #fff; color: var(--daraz-orange); border: 1.5px solid var(--daraz-orange);
      padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
    }

    /* Cart Drawer */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .cart-item-title { font-size: 13px; font-weight: 600; width: 60%; }
    .cart-item-price { font-size: 13px; color: var(--daraz-orange); font-weight: 700; }
    .remove-cart-item { color: #ef4444; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="brand-title">Fulkoli Shop <span>Corner</span></div>
  <div class="search-container">
    <input type="text" id="searchInput" onkeyup="searchProduct()" placeholder="প্রোডাক্টের নাম দিয়ে খুঁজুন...">
    <i class="fas fa-search"></i>
  </div>
</header>

<div class="container">
  <!-- Categories Scrollbar -->
  <div class="category-scroll">
    <button class="cat-btn active" onclick="filterCategory('all', this)">সব কিছু</button>
    <button class="cat-btn" onclick="filterCategory('Electronics', this)">ইলেকট্রনিক্স</button>
    <button class="cat-btn" onclick="filterCategory('Fashion', this)">ফ্যাশন</button>
    <button class="cat-btn" onclick="filterCategory('Gadgets', this)">গ্যাজেটস</button>
    <button class="cat-btn" onclick="filterCategory('Lifestyle', this)">লাইফস্টাইল</button>
  </div>

  <div class="grid" id="productGrid">
    <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> প্রোডাক্ট লোড হচ্ছে...</p>
  </div>
</div>

<!-- Floating Cart Button -->
<div class="floating-cart" onclick="openCartModal()">
  <i class="fas fa-shopping-cart"></i>
  <span>কার্ট</span>
  <span class="cart-count" id="cartCount">0</span>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="productModal">
  <div class="detail-window">
    <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
    <div class="detail-content">
      <div class="gallery-container">
        <img id="mainImage" class="main-preview" src="" alt="Product Image">
        <div class="thumb-list" id="thumbList"></div>
      </div>

      <div class="info-container">
        <div>
          <h2 class="modal-title" id="mTitle"></h2>
          <div class="modal-price" id="mPrice"></div>
          <div class="modal-desc" id="mDesc"></div>
        </div>

        <button class="btn-add-cart-modal" onclick="addToCartFromModal()"><i class="fas fa-cart-plus"></i> কার্টে যুক্ত করুন</button>

        <form id="orderForm" onsubmit="submitOrder(event)">
          <div class="form-group">
            <label>আপনার নাম *</label>
            <input type="text" id="cName" required placeholder="মো: শফিক">
          </div>
          <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="cPhone" required placeholder="017XXXXXXXX">
          </div>
          <div class="form-group">
            <label>পূর্ণাঙ্গ ঠিকানা *</label>
            <textarea id="cAddress" rows="2" required placeholder="বাসা/রোড/এলাকা..."></textarea>
          </div>
          <div class="form-group">
            <label>ডেলিভারি এরিয়া *</label>
            <select id="cZone">
              <option value="ঢাকার ভিতরে (৳৮০)">ঢাকার ভিতরে (৳৮০)</option>
              <option value="ঢাকার বাইরে (৳১৫০)">ঢাকার বাইরে (৳১৫০)</option>
            </select>
          </div>
          
          <button type="submit" class="btn-submit-order" id="orderBtn">
            <i class="fas fa-shopping-bag"></i> সরাসরি অর্ডার করুন
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
  <div class="detail-window" style="max-width: 500px; padding: 20px;">
    <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
    <h3 style="margin-bottom: 15px; color: var(--daraz-orange);"><i class="fas fa-shopping-cart"></i> আপনার কার্ট</h3>
    <div id="cartItemsContainer"></div>
    <div style="margin-top: 15px; font-weight: 700; font-size: 16px; text-align: right;">
      মোট: ৳<span id="cartTotal">0</span>
    </div>
    <form id="cartOrderForm" onsubmit="submitCartOrder(event)" style="margin-top: 15px;">
      <div class="form-group"><input type="text" id="cartCName" required placeholder="আপনার নাম"></div>
      <div class="form-group"><input type="tel" id="cartCPhone" required placeholder="মোবাইল নম্বর"></div>
      <div class="form-group"><textarea id="cartCAddress" rows="2" required placeholder="ঠিকানা"></textarea></div>
      <div class="form-group">
        <select id="cartCZone">
          <option value="ঢাকার ভিতরে (৳৮০)">ঢাকার ভিতরে (৳৮০)</option>
          <option value="ঢাকার বাইরে (৳১৫০)">ঢাকার বাইরে (৳১৫০)</option>
        </select>
      </div>
      <button type="submit" class="btn-submit-order" id="cartOrderBtn">অর্ডার কনফার্ম করুন</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB_Bi4bN2SMsJTHGS798JfQwlDGxuU2C7o",
    authDomain: "fulkoli-shop-corner.firebaseapp.com",
    databaseURL: "https://fulkoli-shop-corner-default-rtdb.firebaseio.com",
    projectId: "fulkoli-shop-corner",
    storageBucket: "fulkoli-shop-corner.firebasestorage.app",
    messagingSenderId: "706742237242",
    appId: "1:706742237242:web:0afec7b275fef82ae69d03",
    measurementId: "G-EZ4JXP3K40"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let productsList = [];
  let activeProduct = null;
  let cart = [];

  const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    productsList = [];
    snapshot.forEach((doc) => {
      productsList.push({ id: doc.id, ...doc.data() });
    });
    renderProducts(productsList);
  });

  function renderProducts(items) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    if(items.length === 0) {
      grid.innerHTML = '<p class="loading-text">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>';
      return;
    }
    items.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="img-box" onclick="openModal('${p.id}')"><img src="${p.image}" alt="${p.title}"></div>
        <div class="title" onclick="openModal('${p.id}')">${p.title}</div>
        <div class="price">৳${p.price}</div>
        <div class="card-actions">
          <button class="btn-cart-icon" onclick="addToCart(event, '${p.id}')"><i class="fas fa-cart-plus"></i></button>
          <button class="btn-view" onclick="openModal('${p.id}')">অর্ডার করুন</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  window.filterCategory = function(category, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(category === 'all') {
      renderProducts(productsList);
    } else {
      const filtered = productsList.filter(p => p.category === category);
      renderProducts(filtered);
    }
  };

  window.addToCart = function(e, id) {
    e.stopPropagation();
    const item = productsList.find(p => p.id === id);
    if(item) {
      cart.push(item);
      updateCartUI();
      alert(`"${item.title}" কার্টে যোগ করা হয়েছে!`);
    }
  };

  window.addToCartFromModal = function() {
    if(activeProduct) {
      cart.push(activeProduct);
      updateCartUI();
      closeModal('productModal');
      alert(`"${activeProduct.title}" কার্টে যোগ করা হয়েছে!`);
    }
  };

  function updateCartUI() {
    document.getElementById('cartCount').innerText = cart.length;
    const container = document.getElementById('cartItemsContainer');
    container.innerHTML = '';
    let total = 0;
    
    if(cart.length === 0) {
      container.innerHTML = '<p style="text-align:center; color: #777;">কার্ট সম্পূর্ণ খালি!</p>';
    } else {
      cart.forEach((item, index) => {
        total += Number(item.price);
        container.innerHTML += `
          <div class="cart-item">
            <span class="cart-item-title">${item.title}</span>
            <span class="cart-item-price">৳${item.price}</span>
            <i class="fas fa-trash remove-cart-item" onclick="removeFromCart(${index})"></i>
          </div>
        `;
      });
    }
    document.getElementById('cartTotal').innerText = total;
  }

  window.removeFromCart = function(index) {
    cart.splice(index, 1);
    updateCartUI();
  };

  window.openCartModal = function() {
    updateCartUI();
    document.getElementById('cartModal').classList.add('active');
  };

  window.openModal = function(id) {
    activeProduct = productsList.find(item => item.id === id);
    if(!activeProduct) return;

    document.getElementById('mTitle').innerText = activeProduct.title;
    document.getElementById('mPrice').innerText = `৳${activeProduct.price}`;
    document.getElementById('mDesc').innerText = activeProduct.description || '';
    
    const mainImg = document.getElementById('mainImage');
    const thumbList = document.getElementById('thumbList');
    thumbList.innerHTML = '';
    const images = activeProduct.images && activeProduct.images.length > 0 ? activeProduct.images : [activeProduct.image];
    mainImg.src = images[0];

    if(images.length > 1) {
      images.forEach((imgUrl, index) => {
        const thumb = document.createElement('img');
        thumb.src = imgUrl;
        thumb.className = `thumb-img ${index === 0 ? 'active' : ''}`;
        thumb.onclick = (e) => {
          e.stopPropagation();
          mainImg.src = imgUrl;
          document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        };
        thumbList.appendChild(thumb);
      });
    }

    document.getElementById('productModal').classList.add('active');
  };

  window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

  // Single Product Submit Order
  window.submitOrder = async function(event) {
    event.preventDefault();
    const orderBtn = document.getElementById('orderBtn');
    orderBtn.disabled = true;
    orderBtn.innerText = "প্রসেস হচ্ছে...";

    const name = document.getElementById('cName').value;
    const phone = document.getElementById('cPhone').value;
    const address = document.getElementById('cAddress').value;
    const zone = document.getElementById('cZone').value;

    try {
      await addDoc(collection(db, "orders"), {
        productTitle: activeProduct.title,
        productPrice: activeProduct.price,
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        deliveryZone: zone,
        status: "Pending",
        createdAt: serverTimestamp()
      });

      alert("অর্ডার সফলভাবে গ্রহণ করা হয়েছে!");
      const phoneNum = "8801600074285";
      const message = `🛍️ *নতুন অর্ডার এসেছে!*\n\n📦 প্রোডাক্ট: ${activeProduct.title}\n💰 মূল্য: ৳${activeProduct.price}\n👤 নাম: ${name}\n📞 ফোন: ${phone}\n📍 ঠিকানা: ${address}\n🚚 এরিয়া: ${zone}`;
      window.open(`https://wa.me/${phoneNum}?text=${encodeURIComponent(message)}`, '_blank');

      closeModal('productModal');
      document.getElementById('orderForm').reset();
    } catch (err) { alert("সমস্যা হয়েছে: " + err.message); }
    finally { orderBtn.disabled = false; orderBtn.innerText = "সরাসরি অর্ডার করুন"; }
  };

  // Cart Order Submit
  window.submitCartOrder = async function(event) {
    event.preventDefault();
    if(cart.length === 0) { alert("আপনার কার্ট খালি!"); return; }
    
    const cartBtn = document.getElementById('cartOrderBtn');
    cartBtn.disabled = true;
    cartBtn.innerText = "প্রসেস হচ্ছে...";

    const name = document.getElementById('cartCName').value;
    const phone = document.getElementById('cartCPhone').value;
    const address = document.getElementById('cartCAddress').value;
    const zone = document.getElementById('cartCZone').value;

    const titles = cart.map(i => i.title).join(", ");
    const totalPrice = document.getElementById('cartTotal').innerText;

    try {
      await addDoc(collection(db, "orders"), {
        productTitle: titles,
        productPrice: totalPrice,
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        deliveryZone: zone,
        status: "Pending",
        createdAt: serverTimestamp()
      });

      alert("কার্টের অর্ডারটি সফলভাবে নেওয়া হয়েছে!");
      const phoneNum = "8801600074285";
      const message = `🛍️ *কার্ট থেকে অর্ডার এসেছে!*\n\n📦 প্রোডাক্টসমূহ: ${titles}\n💰 মোট মূল্য: ৳${totalPrice}\n👤 নাম: ${name}\n📞 ফোন: ${phone}\n📍 ঠিকানা: ${address}\n🚚 এরিয়া: ${zone}`;
      window.open(`https://wa.me/${phoneNum}?text=${encodeURIComponent(message)}`, '_blank');

      cart = [];
      updateCartUI();
      closeModal('cartModal');
      document.getElementById('cartOrderForm').reset();
    } catch (err) { alert("সমস্যা হয়েছে: " + err.message); }
    finally { cartBtn.disabled = false; cartBtn.innerText = "অর্ডার কনফার্ম করুন"; }
  };

  window.searchProduct = function() {
    let queryText = document.getElementById('searchInput').value.toLowerCase();
    let cards = document.getElementsByClassName('product-card');
    for (let card of cards) {
      let title = card.querySelector('.title').innerText.toLowerCase();
      card.style.display = title.includes(queryText) ? "flex" : "none";
    }
  };
</script>
</body>
</html>
